name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU torch; transformers is not needed by the tested paths.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install boto3 numpy pandas requests pytest

      # The credentials in tests/conftest.py are deliberately invalid, so a test
      # that reached AWS would fail rather than touch an account.
      - run: pytest -q
